name: Deploy PrintPilot Mini to Cloudflare
on:
  workflow_dispatch:
  push:
    branches:
      - feature/printpilot-mini-cloudflare
    paths:
      - printpilot-mini/**
      - printpilot-mini-deploy/**
      - .github/workflows/deploy-printpilot-mini.yml
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy worker static assets
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: ./printpilot-mini-deploy
          command: deploy
