name: PrintPilot Mini v2 - Access diagnostics (read-only)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/printpilot-mini-v2-access.yml'
jobs:
  access-diagnose:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    environment: printpilot-mini-v2-staging
    env:
      CF_PRINTPILOT_ACCESS_TOKEN: ${{ secrets.CF_PRINTPILOT_ACCESS_TOKEN }}
      CF_PRINTPILOT_ACCOUNT_ID: ${{ secrets.CF_PRINTPILOT_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/printpilot-mini-v2-secure-backend
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Diagnose staging Access settings without modifying Cloudflare
        shell: bash
        run: |
          set +e
          node printpilot-mini-v2/scripts/access-diagnose.mjs > access-check.log 2>&1
          result=$?
          printf '\nDiagnostic exit status: %s\n' "$result" >> access-check.log
          cat access-check.log
          exit 0
      - name: Share sanitized diagnostic log with report job
        uses: actions/upload-artifact@v4
        with:
          name: printpilot-v2-access-diagnosis
          path: access-check.log
          retention-days: 3
  publish-report:
    needs: access-diagnose
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: printpilot-v2-access-diagnosis
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const lines = fs.readFileSync('access-check.log', 'utf8')
              .split('\n').filter(line => /^(Staging Access app exists:|Worker-scoped destinations:|Access policies linked:|Display policy linked:|Cloudflare member policy linked:|Available identity provider types:|Application selects specific identity providers:|One-time PIN provider allowed by application:|Automatic identity redirect:|Linked policy detail endpoint unavailable:|Identity provider listing unavailable:|READ-ONLY check completed\.|Diagnostic exit status:|Error: )/.test(line))
              .map(line => line.slice(0, 250));
            const data = JSON.stringify({
              type: 'printpilot-v2-staging-readonly-diagnostics',
              generated_at: new Date().toISOString(),
              conclusion: lines.some(x => x === 'Diagnostic exit status: 0') ? 'complete' : 'requires-diagnosis',
              lines
            }, null, 2) + '\n';
            const path='printpilot-mini-v2/access-diagnostics-latest.json';
            const {owner,repo}=context.repo;
            let sha;
            try {
              const old = await github.rest.repos.getContent({owner,repo,path,ref:'main'});
              sha = old.data.sha;
            } catch (e) {
              if (e.status !== 404) throw e;
            }
            await github.rest.repos.createOrUpdateFileContents({
              owner,repo,path,branch:'main',sha,
              message:'Record sanitized PrintPilot v2 Access read-only diagnosis',
              content:Buffer.from(data).toString('base64')
            });
