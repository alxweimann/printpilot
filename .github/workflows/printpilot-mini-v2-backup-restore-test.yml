name: PrintPilot Mini v2 - isolated backup restore test
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/printpilot-mini-v2-backup-restore-test.yml'
permissions:
  contents: read
concurrency:
  group: printpilot-v2-backup-restore-test
  cancel-in-progress: false
jobs:
  backup-restore:
    runs-on: ubuntu-latest
    environment: printpilot-mini-v2-staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_PRINTPILOT_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_PRINTPILOT_ACCOUNT_ID }}
      PRINTPILOT_D1_ID: ${{ secrets.CF_PRINTPILOT_D1_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/printpilot-mini-v2-secure-backend
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Export staging D1 to ephemeral runner and verify isolated SQLite recovery
        shell: bash
        working-directory: printpilot-mini-v2
        run: |
          set -Eeuo pipefail
          umask 077
          trap 'rm -f ./private-d1-export.sql ./private-d1-export.restored.sqlite' EXIT
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$PRINTPILOT_D1_ID"
          python3 - <<'PY'
          import os
          import re
          import pathlib
          s=pathlib.Path('wrangler.example.jsonc').read_text()
          assert '"name": "printpilot-mini-v2-staging"' in s
          assert '"database_name": "printpilot-mini-v2-staging"' in s
          d=os.environ['PRINTPILOT_D1_ID']
          assert re.fullmatch(r'[a-fA-F0-9-]{36}',d)
          pathlib.Path('wrangler.jsonc').write_text(s.replace('REPLACE_WITH_D1_DATABASE_UUID',d))
          PY
          npm install --no-save --no-package-lock --silent wrangler@4
          timeout 180s npx wrangler d1 export printpilot-mini-v2-staging --remote --skip-confirmation --config wrangler.jsonc --output ./private-d1-export.sql > /dev/null
          python3 scripts/verify-backup.py ./private-d1-export.sql > "$GITHUB_WORKSPACE/d1-restore-result.json"
      - name: Publish only non-sensitive test summary for report job
        if: always()
        shell: bash
        run: |
          if [ ! -f d1-restore-result.json ]; then
            printf '{"kind":"printpilot-mini-v2-d1-offline-restore","result":"fail","reason":"export_or_restore_failed"}\n' > d1-restore-result.json
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: printpilot-v2-d1-restore-summary-no-data
          path: d1-restore-result.json
          retention-days: 3
  record:
    if: always()
    needs: [backup-restore]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: printpilot-v2-d1-restore-summary-no-data
      - uses: actions/github-script@v7
        env:
          JOB_CONCLUSION: ${{ needs.backup-restore.result }}
        with:
          script: |
            const fs=require('node:fs');
            const {owner,repo}=context.repo;
            const path='printpilot-mini-v2/d1-restore-report.json';
            const data=JSON.parse(fs.readFileSync('d1-restore-result.json','utf8'));
            const report=JSON.stringify({
              ...data,
              workflow_result:process.env.JOB_CONCLUSION,
              run_id:context.runId,
              checked_at:new Date().toISOString(),
              source:'staging D1 remote export',
              restored_to:'temporary local SQLite only',
              remote_database_modified:false,
              snapshot_retained:false,
              note:'Single backup/restore drill; not a durable automated backup policy.'
            },null,2)+'\n';
            let sha;
            try{sha=(await github.rest.repos.getContent({owner,repo,path,ref:'main'})).data.sha}
            catch(e){if(e.status!==404)throw e}
            await github.rest.repos.createOrUpdateFileContents({
              owner,repo,path,branch:'main',sha,
              message:'Record staging D1 read-only export and offline restore verification',
              content:Buffer.from(report).toString('base64')
            });
