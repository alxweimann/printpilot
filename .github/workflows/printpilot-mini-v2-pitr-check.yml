name: PrintPilot Mini v2 - D1 point-in-time recovery verification
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/printpilot-mini-v2-pitr-check.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    environment: printpilot-mini-v2-staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_PRINTPILOT_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_PRINTPILOT_ACCOUNT_ID }}
      D1_ID: ${{ secrets.CF_PRINTPILOT_D1_ID }}
    steps:
      - name: Verify Cloudflare D1 Time Travel API is available (read-only)
        shell: bash
        run: |
          set -Eeuo pipefail
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const account=process.env.CLOUDFLARE_ACCOUNT_ID;
          const db=process.env.D1_ID;
          const token=process.env.CLOUDFLARE_API_TOKEN;
          if(!/^[a-f0-9]{32}$/i.test(account||'')||!/^[a-f0-9-]{36}$/i.test(db||'')||!token)throw Error('Missing or invalid staging secrets');
          const base='https://api.cloudflare.com/client/v4/accounts/'+account+'/d1/database/'+db;
          const auth={Authorization:'Bearer '+token,Accept:'application/json'};
          const info=await fetch(base,{headers:auth});
          const infoDoc=await info.json();
          const isStaging=info.ok&&infoDoc.success&&infoDoc.result?.name==='printpilot-mini-v2-staging';
          if(!isStaging)throw Error('Database identity mismatch; refusing to claim PITR readiness.');
          const version=String(infoDoc.result.version||'unknown');
          const bookmark=await fetch(base+'/time_travel/bookmark',{headers:auth});
          const result=await bookmark.json();
          const verified=bookmark.ok&&result.success&&typeof result.result?.bookmark==='string'&&result.result.bookmark.length>0;
          const report={kind:'printpilot-mini-v2-pitr-readonly',staging_db_verified:true,d1_version:version,time_travel_bookmark_available:Boolean(verified),read_only:true,checked_at:new Date().toISOString()};
          fs.writeFileSync('pitr-result.json',JSON.stringify(report,null,2)+'\n');
          if(!verified)throw Error('PITR bookmark endpoint not available (status '+bookmark.status+').');
          console.log('Verified staging D1 and Time Travel bookmark API without performing a restore.');
          JS
      - name: Ensure non-sensitive report always exists
        if: always()
        shell: bash
        run: |
          if [ ! -e pitr-result.json ]; then
            printf '{"kind":"printpilot-mini-v2-pitr-readonly","time_travel_bookmark_available":false,"reason":"check_failed"}\n' > pitr-result.json
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: printpilot-v2-pitr-readonly-result
          path: pitr-result.json
          retention-days: 3
  record:
    if: always()
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: printpilot-v2-pitr-readonly-result
      - uses: actions/github-script@v7
        env:
          CHECK_RESULT: ${{ needs.check.result }}
        with:
          script: |
            const fs=require('node:fs'),{owner,repo}=context.repo;
            const path='printpilot-mini-v2/pitr-check-report.json';
            const report={...JSON.parse(fs.readFileSync('pitr-result.json','utf8')),workflow_result:process.env.CHECK_RESULT,run_id:context.runId};
            let sha;
            try{sha=(await github.rest.repos.getContent({owner,repo,path,ref:'main'})).data.sha}
            catch(e){if(e.status!==404)throw e}
            await github.rest.repos.createOrUpdateFileContents({owner,repo,path,branch:'main',sha,message:'Record verified PrintPilot D1 point-in-time recovery status',content:Buffer.from(JSON.stringify(report,null,2)+'\n').toString('base64')});
