name: PrintPilot Mini v2 - role security tests
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/printpilot-mini-v2-role-tests.yml'
permissions:
  contents: read
jobs:
  roles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/printpilot-mini-v2-secure-backend
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Verify administrator direct-delete change before staging deployment.
      - name: Run all backend and role regression tests
        shell: bash
        run: |
          set +e
          cd printpilot-mini-v2
          node --test --test-reporter=tap test/*.test.mjs > "$GITHUB_WORKSPACE/role-test.log" 2>&1
          result=$?
          cat "$GITHUB_WORKSPACE/role-test.log"
          printf '%s\n' "$result" > "$GITHUB_WORKSPACE/role-test-exit.txt"
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: printpilot-v2-role-regression
          path: |
            role-test.log
            role-test-exit.txt
  record:
    needs: roles
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: printpilot-v2-role-regression
      - uses: actions/github-script@v7
        with:
          script: |
            const fs=require('node:fs');
            const output=fs.readFileSync('role-test.log','utf8');
            const exit=fs.readFileSync('role-test-exit.txt','utf8').trim();
            const summary=output.split('\n').filter(x=>/^# (tests|pass|fail|cancelled|skipped|duration_ms)\b/.test(x));
            const failures=output.split('\n').filter(x=>/^not ok /.test(x)).map(x=>x.slice(0,200));
            const report=JSON.stringify({kind:'printpilot-v2-role-tests',run_id:context.runId,passed:exit==='0',summary,failures},null,2)+'\n';
            const path='printpilot-mini-v2/role-test-report.json', {owner,repo}=context.repo;
            let sha;
            try{sha=(await github.rest.repos.getContent({owner,repo,path,ref:'main'})).data.sha}
            catch(e){if(e.status!==404)throw e}
            await github.rest.repos.createOrUpdateFileContents({owner,repo,path,branch:'main',sha,message:'Record PrintPilot v2 role regression result',content:Buffer.from(report).toString('base64')});
