name: PrintPilot Mini v2 – manual STAGING deploy
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type DEPLOY_PRINTPILOT_V2_STAGING_ONLY to deploy ONLY the separate staging Worker'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: printpilot-mini-v2-staging-deploy
  cancel-in-progress: false
jobs:
  deploy-staging:
    if: github.ref == 'refs/heads/feature/printpilot-mini-v2-secure-backend' && inputs.confirmation == 'DEPLOY_PRINTPILOT_V2_STAGING_ONLY'
    runs-on: ubuntu-latest
    environment: printpilot-mini-v2-staging
    defaults:
      run:
        working-directory: printpilot-mini-v2
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_PRINTPILOT_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_PRINTPILOT_ACCOUNT_ID }}
      PRINTPILOT_D1_ID: ${{ secrets.CF_PRINTPILOT_D1_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check credentials without printing them
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "Missing CF_PRINTPILOT_TOKEN" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "Missing CF_PRINTPILOT_ACCOUNT_ID" && exit 1)
          test -n "$PRINTPILOT_D1_ID" || (echo "Missing CF_PRINTPILOT_D1_ID" && exit 1)
      - name: Generate staging-only Wrangler configuration
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            const template = fs.readFileSync("wrangler.example.jsonc","utf8");
            if (!/^[a-f\d]{8}-[a-f\d-]{27,}$/.test(process.env.PRINTPILOT_D1_ID)) {
              throw new Error("Unexpected D1 ID format");
            }
            const config = template.replace("REPLACE_WITH_D1_DATABASE_UUID",process.env.PRINTPILOT_D1_ID);
            if (!config.includes("\"name\": \"printpilot-mini-v2-staging\"")) {
              throw new Error("Refusing to deploy any other Worker");
            }
            fs.writeFileSync("wrangler.jsonc",config);
          '
      - name: Install Wrangler
        run: npm install --no-save --no-package-lock wrangler@4
      - name: Test staged code
        run: npm test
      - name: Apply D1 migrations (staging DB only)
        run: npx wrangler d1 migrations apply printpilot-mini-v2-staging --remote --config wrangler.jsonc
      - name: Deploy isolated staging Worker (NOT red-king-5309)
        run: npx wrangler deploy --config wrangler.jsonc
