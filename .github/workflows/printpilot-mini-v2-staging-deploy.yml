name: PrintPilot Mini v2 – isolated staging deploy
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/printpilot-mini-v2-staging-deploy.yml'
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type DEPLOY_PRINTPILOT_V2_STAGING_ONLY'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: printpilot-mini-v2-staging-deploy
  cancel-in-progress: false
jobs:
  deploy-staging:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.confirmation == 'DEPLOY_PRINTPILOT_V2_STAGING_ONLY')
    runs-on: ubuntu-latest
    environment: printpilot-mini-v2-staging
    defaults:
      run:
        working-directory: printpilot-mini-v2
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_PRINTPILOT_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_PRINTPILOT_ACCOUNT_ID }}
      PRINTPILOT_D1_ID: ${{ secrets.CF_PRINTPILOT_D1_ID }}
    steps:
      - name: Checkout ONLY the separate v2 test branch
        uses: actions/checkout@v4
        with:
          ref: feature/printpilot-mini-v2-secure-backend
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check required secrets without printing them
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "Missing CF_PRINTPILOT_TOKEN" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "Missing CF_PRINTPILOT_ACCOUNT_ID" && exit 1)
          test -n "$PRINTPILOT_D1_ID" || (echo "Missing CF_PRINTPILOT_D1_ID" && exit 1)
      - name: Generate config restricted to staging
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            const template = fs.readFileSync("wrangler.example.jsonc", "utf8");
            const id=process.env.PRINTPILOT_D1_ID;
            if(!/^[0-9a-f]{8}-[0-9a-f-]{27,}$/i.test(id)) throw new Error("Invalid D1 UUID");
            if (!template.includes("\"name\": \"printpilot-mini-v2-staging\""))
              throw new Error("Worker name mismatch – refusing deployment");
            fs.writeFileSync("wrangler.jsonc", template.replace("REPLACE_WITH_D1_DATABASE_UUID", id));
          '
      - name: Install Wrangler
        run: npm install --no-save --no-package-lock wrangler@4
      # Release: remove obsolete Testwoche demo controls; staging only.
      - name: Test application before any changes to Cloudflare
        run: npm test
      - name: Apply migrations to isolated D1 only
        run: npx wrangler d1 migrations apply printpilot-mini-v2-staging --remote --config wrangler.jsonc
      - name: Deploy only new v2 staging Worker
        run: npx wrangler deploy --config wrangler.jsonc

  record-result:
    if: always() && github.ref == 'refs/heads/main'
    needs: [deploy-staging]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const {owner,repo}=context.repo;
            const path='printpilot-mini-v2/staging-deploy-report.json';
            const status='${{ needs.deploy-staging.result }}';
            const report=JSON.stringify({
              kind:'printpilot-mini-v2-staging-deploy',
              run_id:context.runId,
              status,
              completed_at:new Date().toISOString(),
              target:'printpilot-mini-v2-staging',
              source_branch:'feature/printpilot-mini-v2-secure-backend'
            },null,2)+'\n';
            let sha;
            try{sha=(await github.rest.repos.getContent({owner,repo,path,ref:'main'})).data.sha}
            catch(e){if(e.status!==404)throw e}
            await github.rest.repos.createOrUpdateFileContents({
              owner,repo,path,branch:'main',sha,
              message:'Record isolated PrintPilot v2 staging deployment result',
              content:Buffer.from(report).toString('base64')
            });
